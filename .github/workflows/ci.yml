name: Windows CI

on:
  push:
    branches: [ main, "sprint-*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Generated Status & Docs Sync
        run: python tools/generate_status.py --check

      - name: Setup MSVC x64 Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (CMake + Ninja)
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Build (Zero-Warning /W4 Check)
        run: cmake --build build

      - name: Run CPU CTest Suite
        env:
          SCARLETT_HEADLESS: "1"
        run: ctest --test-dir build -L cpu --output-on-failure

      - name: Run GPU CTest Suite on Microsoft WARP
        env:
          SCARLETT_HEADLESS: "1"
          SCARLETT_USE_WARP: "1"
        run: ctest --test-dir build -L gpu --output-on-failure
